[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "toi-1258-validation"
version = "0.3.1"
description = "Reproducible evidence checks for the TOI-1258.01 statistical-validation analysis."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "LICENSE-CC-BY-4.0.txt", "research/third_party/triceratops/LICENSE"]
requires-python = ">=3.11"
authors = [{name = "Nikolai Klaus Stoloff"}]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Astronomy",
]

[project.optional-dependencies]
figures = ["matplotlib>=3.8,<4"]
dev = ["ruff>=0.11,<1", "build>=1.2,<2", "cffconvert>=2,<3"]

[project.scripts]
toi1258-audit = "toi1258.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
exclude = ["research"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tools/*.py" = ["E402"]

